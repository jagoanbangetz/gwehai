version: '3.8'

services:
  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: gwehai-frontend
    container_name: gwehai-frontend
    ports:
      - "4173:4173"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4173/"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - gwehai-network

  # Run only when needed: docker-compose run --rm playwright
  playwright:
    profiles:
      - e2e
    build:
      context: ./frontend
      dockerfile: Dockerfile.playwright
    image: gwehai-playwright
    container_name: gwehai-playwright
    environment:
      BASE_URL: http://frontend-app:4173
      CI: "1"
    depends_on:
      frontend-app:
        condition: service_healthy
    ipc: host
    networks:
      - gwehai-network
    command: ["npx", "playwright", "test", "--project=chromium"]

  pentest-tools:
    build:
      context: ./backend/skills
      dockerfile: Dockerfile.pentest-tools
    image: gwehai-pentest-tools
    container_name: gwehai-pentest-tools
    # Keep running so backend can: docker exec gwehai-pentest-tools <cmd>
    command: ["sleep", "infinity"]
    volumes:
      # AI-written JS scripts (write_script tool); backend writes here, container runs node /opt/browser/scripts/<name>.js
      - ./backend/skills/browser/scripts:/opt/browser/scripts
    # Optional: mount workspace for saving outputs (e.g. reports) into host
    # volumes:
    #   - ./backend/workspace:/workspace
    networks:
      - gwehai-network

  postgres:
    image: postgres:15-alpine
    container_name: gwehai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gwehai
      POSTGRES_PASSWORD: gwehai_dev_password
      POSTGRES_DB: gwehai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gwehai -d gwehai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - gwehai-network

volumes:
  postgres_data:

networks:
  gwehai-network:
    driver: bridge
