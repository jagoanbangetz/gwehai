name: Deploy to Staging

on:
  push:
    branches: [main]

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 45.77.250.83 >> ~/.ssh/known_hosts

      - name: Build backend
        run: cd backend && npm ci && npm run build

      - name: Build frontend
        run: cd frontend && npm ci && npx vite build

      - name: Deploy to staging server
        run: |
          rsync -avz --delete -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no' \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env*' \
            --exclude '*.local' \
            --exclude 'src/' \
            --exclude 'tests/' \
            --exclude 'test/' \
            --exclude '__tests__/' \
            --exclude 'docs/' \
            ./ root@45.77.250.83:/home/www/gwehai/

      - name: Install deps & restart services
        run: |
          ssh -i ~/.ssh/deploy_key root@45.77.250.83 "
            set -e
            cd /home/www/gwehai

            # Clean git state (jaga-jaga kalo ada manual edit)
            git stash --include-untracked 2>/dev/null || true
            git checkout main 2>/dev/null || true

            # Restore .env jika belum ada
            test -f backend/.env || cp /home/www/gwehai_bak/backend/.env backend/.env 2>/dev/null || echo 'WARNING: no .env found'

            # Backend production deps
            cd backend && npm ci --omit=dev && cd ..

            # Frontend deps (dist udah di-rsync dari runner)
            cd frontend && npm ci --omit=dev && cd ..

            # Restart PM2
            pm2 restart gwehai-api --update-env

            echo '=== DEPLOY COMPLETE ==='
          "

      - name: Health check
        run: |
          sleep 3
          curl -sSf http://45.77.250.83:3100/api/health | jq -e '.status == "ok"'
          echo "✅ Health check passed — backend OK"

      - name: Verify frontend
        run: |
          curl -sSf -o /dev/null -w "Frontend HTTP %{http_code}\n" https://dev.gweh.sh/
