name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 45.77.250.83 >> ~/.ssh/known_hosts

      - name: Build & Deploy via rsync
        run: |
          # Build backend
          cd backend && npm ci && npm run build && cd ..

          # Build frontend (skip tsc type check — known TS errors from refactor)
          cd frontend && npm ci && npx vite build && cd ..

          # Rsync ke server staging
          rsync -avz --delete -e 'ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no' \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env*' \
            --exclude '*.local' \
            ./ root@45.77.250.83:/home/www/gwehai/

      - name: Install deps & restart on server
        run: |
          ssh -i ~/.ssh/deploy_key root@45.77.250.83 "
            cd /home/www/gwehai &&
            cp /home/www/gwehai_bak/backend/.env /home/www/gwehai/backend/.env 2>/dev/null;
            cd backend && npm ci --production && cd .. &&
            cd frontend && npm ci && npx vite build && cd .. &&
            pm2 restart gwehai-api &&
            echo 'Deploy selesai!'
          "

      - name: Health Check
        run: |
          sleep 3
          curl -s --fail http://45.77.250.83:3100/api/health || exit 1
          echo "Health check passed!"
